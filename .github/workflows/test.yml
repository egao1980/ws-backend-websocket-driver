name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  SBCL_VERSION: 2.6.7
  ROSWELL_VERSION: "26.02.116"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test:
    uses: egao1980/cl-repository/.github/workflows/test-system.yml@main
    with:
      system: ws-backend-websocket-driver

  wss-openssl:
    runs-on: ubuntu-latest
    container: ghcr.io/egao1980/cl-repository/ci-base:latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      packages: read
    env:
      WS_PROTOCOL_WSS: "1"
      WS_PROTOCOL_WSS_CHILD: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: egao1980/cl-repository/.github/actions/setup-lisp@main
        with:
          sbcl-version: ${{ env.SBCL_VERSION }}
          roswell-version: ${{ env.ROSWELL_VERSION }}
      - uses: egao1980/cl-repository/.github/actions/ci@main
        with:
          phase: install
          system: ws-backend-websocket-driver
      - uses: egao1980/cl-repository/.github/actions/ci@main
        with:
          phase: test
          system: ws-backend-websocket-driver
